
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form 106 Request</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 450px;
    margin: 50px auto;
    padding: 20px;
    background: #f5f5f5;
  }

  .container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 12px #0001;
  }

  h2 { text-align: center; }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled {
    background: #999;
  }

  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-top: 20px;
    padding: 12px;
    background: #eee;
    border-radius: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Form 106 Request</h2>

  <label for="tikNik">תיק ניכויים</label>
  <input id="tikNik" type="number">

  <label for="yeshut">Yeshut</label>
  <input id="yeshut" type="number">

  <label for="year">Year</label>
  <input id="year" type="number" value="2025">


  <button id="sendBtn" onclick="sendRequest()">
    Send Request
  </button>

  <pre id="result">Response will appear here...</pre>
</div>

<script>
async function sendRequest() {
  const tikNik = document.getElementById("tikNik").value;
  const year = document.getElementById("year").value;
  const yeshut = document.getElementById("yeshut").value;
  const result = document.getElementById("result");
  const button = document.getElementById("sendBtn");

  if (!tikNik || !year || !yeshut) {
    result.textContent = "Please fill in all fields.";
    return;
  }

  const payload = {
    tikNik: Number(tikNik),
    year: Number(year),
    yeshut: Number(yeshut)
  };

  button.disabled = true;
  result.textContent = "Sending request...";

  try {
    const response = await fetch(
      "https://secapp.taxes.gov.il/srCrmGeneralApi/api/getfileForm106",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      }
    );

    const responseText = await response.text();

    result.textContent =
      "HTTP Status: " + response.status + "\n\n" +
      responseText;

  } catch (error) {
    result.textContent =
      "Request failed:\n" + error.message +
      "\n\nCheck CORS permissions and network connectivity.";
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
